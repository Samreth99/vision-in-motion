# Shared input configuration for both encoders
num_frames: 16          # uniformly sampled, same indices for every model
resolution: 256         # center crop resized to 256x256
crop: center
normalize: imagenet     # mean=[0.485,0.456,0.406] std=[0.229,0.224,0.225]
heldout_frac: 0.10      # held-out split of the training subset, for tuning
